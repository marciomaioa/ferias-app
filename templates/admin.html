<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 20px; }
        .table th, .table td { vertical-align: middle; }
        .btn-editar { cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>👑 Admin - Equipe {{ equipe }}</h1>
            <div>
                <a href="/" class="btn btn-secondary me-2">Voltar</a>
                <a href="/logout" class="btn btn-danger">Sair</a>
            </div>
        </div>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="usuarios-tab" data-bs-toggle="tab" data-bs-target="#usuarios" type="button">Usuários</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="config-tab" data-bs-toggle="tab" data-bs-target="#config" type="button">Configuração</button>
            </li>
        </ul>
        <div class="tab-content mt-3">
            <div class="tab-pane active" id="usuarios">
                <div class="mb-2 d-flex gap-2">
                    <button class="btn btn-primary" id="btn-novo-usuario">+ Novo Usuário</button>
                    <button class="btn btn-success" id="btn-gerar-pdf">📄 Gerar Relatório PDF</button>
                </div>
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr><th>ID</th><th>Nome</th><th>Nível</th><th>Login</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="tabela-usuarios"></tbody>
                </table>
            </div>
            <div class="tab-pane" id="config">
                <h4>Configuração do ano</h4>
                <form id="form-config">
                    <div class="mb-3">
                        <label for="ano" class="form-label">Ano</label>
                        <input type="number" class="form-control" id="ano" name="ano" value="2027" required>
                    </div>
                    <button type="submit" class="btn btn-success">Atualizar feriados nacionais</button>
                    <div id="msg-config" class="mt-2"></div>
                </form>
                <p class="mt-3">Feriados serão carregados automaticamente com base no ano informado.</p>
            </div>
        </div>
    </div>

    <!-- Modal para criar/editar usuário -->
    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalUsuarioLabel">Novo Usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-usuario">
                        <input type="hidden" id="usuario-id" value="">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="nivel" class="form-label">Nível de prioridade (1-4)</label>
                            <input type="number" class="form-control" id="nivel" min="1" max="4" required>
                        </div>
                        <div class="mb-3">
                            <label for="login" class="form-label">Login</label>
                            <input type="text" class="form-control" id="login" required>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha (deixe em branco para manter)</label>
                            <input type="password" class="form-control" id="senha">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-salvar-usuario">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(function() {
            const modalUsuario = new bootstrap.Modal(document.getElementById('modalUsuario'));

            function carregarUsuarios() {
                $.get('/api/admin/usuarios', function(usuarios) {
                    let html = '';
                    usuarios.forEach(u => {
                        html += `<tr>
                                    <td>${u.id}</td>
                                    <td>${u.nome}</td>
                                    <td>${u.nivel}</td>
                                    <td>${u.login}</td>
                                    <td>
                                        <button class="btn btn-sm btn-warning btn-editar" data-id="${u.id}" data-nome="${u.nome}" data-nivel="${u.nivel}" data-login="${u.login}">Editar</button>
                                    </td>
                                </tr>`;
                    });
                    $('#tabela-usuarios').html(html);
                });
            }
            carregarUsuarios();

            $('#btn-novo-usuario').click(function() {
                $('#modalUsuarioLabel').text('Novo Usuário');
                $('#usuario-id').val('');
                $('#nome').val('');
                $('#nivel').val('');
                $('#login').val('');
                $('#senha').val('');
                modalUsuario.show();
            });

            $('#tabela-usuarios').on('click', '.btn-editar', function() {
                const id = $(this).data('id');
                const nome = $(this).data('nome');
                const nivel = $(this).data('nivel');
                const login = $(this).data('login');
                $('#modalUsuarioLabel').text('Editar Usuário');
                $('#usuario-id').val(id);
                $('#nome').val(nome);
                $('#nivel').val(nivel);
                $('#login').val(login);
                $('#senha').val('');
                modalUsuario.show();
            });

            $('#btn-salvar-usuario').click(function() {
                const id = $('#usuario-id').val();
                const nome = $('#nome').val();
                const nivel = parseInt($('#nivel').val());
                const login = $('#login').val();
                const senha = $('#senha').val();

                if (!nome || !nivel || !login) {
                    alert('Preencha nome, nível e login.');
                    return;
                }

                const data = { nome, nivel, login };
                if (senha) data.senha = senha;

                if (id) {
                    data.id = id;
                    $.ajax({
                        url: '/api/admin/usuarios',
                        method: 'PUT',
                        contentType: 'application/json',
                        data: JSON.stringify(data),
                        success: function(res) {
                            if (res.success) {
                                carregarUsuarios();
                                modalUsuario.hide();
                            } else {
                                alert('Erro: ' + res.error);
                            }
                        },
                        error: function(err) {
                            alert('Erro: ' + err.responseJSON.error);
                        }
                    });
                } else {
                    data.senha = senha || '123';
                    $.ajax({
                        url: '/api/admin/usuarios',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(data),
                        success: function(res) {
                            if (res.success) {
                                carregarUsuarios();
                                modalUsuario.hide();
                            } else {
                                alert('Erro: ' + res.error);
                            }
                        },
                        error: function(err) {
                            alert('Erro: ' + err.responseJSON.error);
                        }
                    });
                }
            });

            $('#form-config').submit(function(e) {
                e.preventDefault();
                const ano = $('#ano').val();
                if (!ano) return;
                $.ajax({
                    url: '/api/admin/config',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ano: parseInt(ano)}),
                    success: function(res) {
                        if (res.success) {
                            $('#msg-config').html('<div class="alert alert-success">Feriados atualizados para ' + res.ano + '.</div>');
                        } else {
                            $('#msg-config').html('<div class="alert alert-danger">Erro: ' + res.error + '</div>');
                        }
                    },
                    error: function(err) {
                        $('#msg-config').html('<div class="alert alert-danger">Erro: ' + err.responseJSON.error + '</div>');
                    }
                });
            });

            $('#btn-gerar-pdf').click(function() {
                const link = document.createElement('a');
                link.href = '/api/admin/relatorio-pdf';
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });
    </script>
</body>
</html>
